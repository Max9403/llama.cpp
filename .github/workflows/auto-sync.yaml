name: Auto sync

on:
  schedule:
    - cron: "17 03 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  repo-sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: customized
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream and fork branches
        run: |
          git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || true

          git fetch upstream \
            +refs/heads/master:refs/remotes/upstream/master

          git fetch origin \
            +refs/heads/master:refs/remotes/origin/master \
            +refs/heads/customized:refs/remotes/origin/customized

      - name: Mirror upstream master
        run: |
          git push origin upstream/master:master \
            --force-with-lease=master:$(git rev-parse origin/master)

      - name: Mirror upstream release tags
        shell: bash
        run: |
          set -euo pipefail

          is_release_tag() {
            local tag="$1"

            # llama.cpp's historical numeric build tags.
            if [[ "$tag" =~ ^b[0-9]+$ ]]; then
              return 0
            fi

            # Semantic-version tags:
            # v1.2.3
            # v1.2.3-rc.1
            # v1.2.3+build.4
            # v1.2.3-rc.1+build.4
            if [[ "$tag" =~ ^v[0-9]+(\.[0-9]+){2}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
              return 0
            fi

            return 1
          }

          # Fetch only candidates that could plausibly be release tags.
          # Filtering to actual SemVer happens below before pushing.
          git fetch upstream \
            '+refs/tags/b*:refs/tags/b*' \
            '+refs/tags/v*:refs/tags/v*'

          # Read matching release tags already present in the fork.
          declare -A origin_tags

          while read -r oid ref; do
            tag="${ref#refs/tags/}"

            if is_release_tag "$tag"; then
              origin_tags["$tag"]="$oid"
            fi
          done < <(
            git ls-remote --tags --refs origin \
              'refs/tags/b*' \
              'refs/tags/v*'
          )

          # Select only upstream-style bNNNNN and actual SemVer tags.
          refs_to_push=()

          while read -r oid ref; do
            tag="${ref#refs/tags/}"

            if ! is_release_tag "$tag"; then
              continue
            fi

            if [[ "${origin_tags[$tag]:-}" != "$oid" ]]; then
              refs_to_push+=("${ref}:${ref}")
            fi
          done < <(
            git for-each-ref \
              --format='%(objectname) %(refname)' \
              refs/tags
          )

          echo "Release tags requiring sync: ${#refs_to_push[@]}"

          # Avoid one huge GitHub ref-update request.
          batch_size=100

          for (( i=0; i<${#refs_to_push[@]}; i+=batch_size )); do
            batch=( "${refs_to_push[@]:i:batch_size}" )

            echo "Pushing release-tag batch $((i / batch_size + 1))"
            git push origin "${batch[@]}"
          done
      - name: Rebase customized onto latest upstream b tag
        shell: bash
        run: |
          set -euo pipefail

          git switch customized

          # Find the highest numeric upstream b tag on upstream/master.
          latest_tag=
          while IFS= read -r tag; do
            [[ "$tag" =~ ^b[0-9]+$ ]] || continue
            if git merge-base --is-ancestor "${tag}^{commit}" upstream/master; then
              latest_tag=$tag
              break
            fi
          done < <(git tag --list 'b[0-9]*' --sort=-version:refname)

          [[ -n "$latest_tag" ]] || {
            echo "No upstream b tag found on upstream/master" >&2
            exit 1
          }

          target=$(git rev-parse "${latest_tag}^{commit}")
          old_head=$(git rev-parse customized)
          old_base=$(git merge-base customized upstream/master)
          expected_remote=$(git rev-parse origin/customized)

          git merge-base --is-ancestor "$old_base" "$target" || {
            echo "$latest_tag is older than customized's current upstream base" >&2
            exit 1
          }

          # Find the latest release tag in customized's PRE-rebase history.
          # Accept the original cX tag and subsequent cX.bY tags.
          old_c_tag=
          while IFS= read -r tag; do
            [[ "$tag" =~ ^c([1-9][0-9]*)(\.b[0-9]+)?$ ]] || continue
            old_c_tag=$tag
            c_num=${BASH_REMATCH[1]}
            break
          done < <(git tag --merged "$old_head" \
            --list 'c[0-9]*' --sort=-version:refname)

          [[ -n "$old_c_tag" ]] || {
            echo "No cX or cX.bY tag is reachable from customized" >&2
            exit 1
          }

          old_release=$(git rev-parse "${old_c_tag}^{commit}")

          # Count how far the release commit is behind the old tip.
          offset=$(git rev-list --count --first-parent "$old_release..$old_head")
          old_count=$(git rev-list --count --first-parent "$old_base..$old_head")

          [[ "$old_release" != "$old_base" ]] &&
          git merge-base --is-ancestor "$old_base" "$old_release" &&
          [[ "$(git rev-parse "$old_head~$offset")" == "$old_release" ]] || {
            echo "$old_c_tag does not mark a custom commit on the rebase path" >&2
            exit 1
          }

          # This position-based mapping assumes a linear custom-commit history.
          [[ "$(git rev-list --count --merges "$old_base..$old_head")" == 0 ]] || {
            echo "customized contains merge commits; cannot safely map the tag" >&2
            exit 1
          }

          echo "Rebasing customized from $old_base onto $latest_tag ($target)"
          git rebase --onto "$target" "$old_base" customized

          # If rebase dropped a commit, the old offset no longer identifies
          # the corresponding release commit. Fail rather than mis-tag it.
          new_count=$(git rev-list --count --first-parent "$target..customized")
          [[ "$new_count" == "$old_count" ]] || {
            echo "Rebase changed the commit count; refusing to guess tag position" >&2
            exit 1
          }

          new_release=$(git rev-parse "customized~$offset")
          new_tag="c${c_num}.${latest_tag}"

          if git show-ref --verify --quiet "refs/tags/$new_tag"; then
            [[ "$(git rev-parse "${new_tag}^{commit}")" == "$new_release" ]] || {
              echo "$new_tag already exists on a different commit" >&2
              exit 1
            }
          else
            git tag "$new_tag" "$new_release"
          fi

          # Push branch and tag together, or neither. Only the branch may be
          # force-updated, and only if it is still at the commit we fetched.
          git push --atomic origin \
            --force-with-lease="refs/heads/customized:$expected_remote" \
            "+refs/heads/customized:refs/heads/customized" \
            "refs/tags/$new_tag:refs/tags/$new_tag"

          echo "Tagged the rebased equivalent of $old_c_tag as $new_tag:"
          git log -1 --format='%h %s' "$new_tag"
